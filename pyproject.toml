[project]
name = "finalproject-aleksashin-m26-555"
version = "0.1.0"
description = "ValutaTrade Hub: консольная платформа для торговли фиатными и криптовалютами с парсером реальных курсов"
readme = "README.md"
authors = [
    { name = "Pavel Aleksashin", email = "aleksashin.pavel@inbox.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.valutatrade]
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
log_file = "actions.log"
parser_log_file = "parser.log"
log_level = "INFO"
log_format = "%(levelname)s %(asctime)s %(message)s"
log_datefmt = "%Y-%m-%dT%H:%M:%S"
log_max_bytes = 1000000
log_backup_count = 5

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
